[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indubio-pro-agente"
version = "0.1.0"
description = "Experimental multi-agent courtroom simulation kernel"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "InDubioProAgente contributors"}]
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
indubio = "indubio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"indubio.scenarios" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
